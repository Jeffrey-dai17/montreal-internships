name: Refresh Montréal internships
on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-listings
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch listings and refresh table
        run: python3 update.py
      - name: Publish changed listings
        run: |
          git add README.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh Montréal internships"
            git push
          fi
